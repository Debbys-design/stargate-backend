services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: stargate
      POSTGRES_USER: stargate
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  reconciler:
    build:
      context: .
      dockerfile: Dockerfile.reconciler
    env_file: .env
    depends_on:
      - postgres
      - redis
